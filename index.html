<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Kept in sync at runtime with the active palette by src/lib/theme.ts,
         so there is deliberately only one of these (no light/dark media pair). -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Nexus AI — expenses, news, AI tutor and cloud, all in one." />
    <!-- iOS ignores the web manifest for the home-screen icon and standalone
         chrome, so these duplicate what manifest.webmanifest already declares. -->
    <link rel="apple-touch-icon" href="/nexusai/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
    <title>Nexus AI</title>
    <!-- Fonts are self-hosted (bundled via @fontsource) so a blocked font CDN
         can never affect the UI on restricted networks. See src/main.tsx. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
